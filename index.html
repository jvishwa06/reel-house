<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelhouse — Movie tickets</title>
<meta name="description" content="Book movie tickets and pick your seat inside a 3D auditorium.">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap">
<style>
/* Reelhouse — cinematic dark theme. Layout: sticky header, page container (max 1240px), seat page is a full-height stage. */
:root{
  color-scheme: dark;
  --bg:#0a0a0c; --bg-2:#0f0f12; --surface:#151418; --surface-2:#1c1b20; --surface-3:#25232a;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#f4f1ea; --ink-2:rgba(244,241,234,.68); --ink-3:rgba(244,241,234,.42);
  --accent:#ffcb5c; --accent-2:#ffb23f; --accent-ink:#1d1606; --accent-soft:rgba(255,203,92,.14);
  --rose:#ff5d73; --green:#46d48a; --amber:#f5b83d;
  --c-classic:#2f6f86; --c-prime:#b3263b; --c-recliner:#7a2430; --c-motion:#e0782f;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px; --r-lg:22px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ---------- header */
.hdr{position:sticky;top:0;z-index:40;background:rgba(10,10,12,.72);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--f-display);letter-spacing:-.01em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#ff7a59);display:grid;place-items:center;box-shadow:0 0 22px rgba(255,190,90,.35)}
.logo-mark svg{width:16px;height:16px;color:var(--accent-ink)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:8px 12px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:14px;transition:color .2s,background .2s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500;transition:border-color .2s,background .2s;white-space:nowrap}
.pill-btn:hover{border-color:var(--line-2);background:var(--surface-3)}
.pill-btn svg{width:16px;height:16px;flex:none}
.pill-btn .kbd{font:500 11px var(--f-mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;margin-left:4px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--f-mono);text-align:center}
@media (max-width:760px){
  .nav{display:none}
  .hdr .wrap{gap:10px}
  .hide-sm{display:none!important}
  .pill-btn{padding:0 11px}
}
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,14,17,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--ink-3)}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  body.has-tabbar main{padding-bottom:84px}
}

/* ---------- generic */
main{min-height:calc(100vh - 64px)}
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-h h2{font:700 24px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.sec-h p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.link{color:var(--accent);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:15px;height:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s,background .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 28px -10px rgba(255,190,80,.7)}
.btn-primary:hover{background:#ffd679}
.btn-primary:disabled{background:var(--surface-3);color:var(--ink-3);box-shadow:none;cursor:default}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--line-2);color:var(--ink);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(255,255,255,.13)}
.btn-sm{height:36px;padding:0 14px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;transition:all .18s}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.28)}
.chip[aria-pressed="true"]{background:var(--ink);color:#141210;border-color:var(--ink)}
.chip svg{width:14px;height:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll-x::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--ink-2);font:600 11.5px/1 var(--f-ui);letter-spacing:.02em;white-space:nowrap}
.tag.cert{border:1px solid var(--line-2);background:transparent}
.tag.gold{background:var(--accent-soft);color:var(--accent)}
.tag.green{background:rgba(70,212,138,.12);color:var(--green)}
.rating{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.rating svg{width:14px;height:14px;color:var(--accent)}
.dot-sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-3);vertical-align:middle;margin:0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font:700 18px var(--f-display);margin-bottom:6px}

/* ---------- hero carousel */
.hero{position:relative;height:min(76vh,640px);min-height:440px;overflow:hidden;border-radius:0 0 28px 28px;isolation:isolate}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.hero-slide.on{opacity:1;pointer-events:auto}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.08);transition:transform 7s linear}
.hero-slide.on .hero-bg{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,12,.92) 0%,rgba(10,10,12,.55) 45%,rgba(10,10,12,.05) 75%),linear-gradient(0deg,var(--bg) 0%,rgba(10,10,12,0) 40%);z-index:1;pointer-events:none}
.hero-c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:70px;max-width:620px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-2);font-size:13.5px}
.hero h1{font:800 clamp(40px,7vw,78px)/.95 var(--f-display);letter-spacing:-.025em;margin:14px 0 10px;text-wrap:balance}
.hero .tl{color:var(--ink-2);font-size:17px;margin:0 0 22px;max-width:46ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-dots{position:absolute;z-index:3;bottom:28px;right:var(--gut-r);display:flex;gap:8px}
.hero-dots button{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.hero-dots button[aria-current="true"]{background:rgba(255,255,255,.35)}
.hero-dots button[aria-current="true"]::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:dotFill 6s linear forwards}
.hero.paused .hero-dots button::after{animation-play-state:paused}
@keyframes dotFill{from{transform:scaleX(0)}}
@media (max-width:760px){.hero{height:68vh;border-radius:0 0 22px 22px}.hero::after{background:linear-gradient(0deg,var(--bg) 8%,rgba(10,10,12,.55) 55%,rgba(10,10,12,.15))}.hero-c{padding-bottom:64px}.hero-dots{left:var(--gut);right:auto}}

/* ---------- filters + poster grid */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gut-r)) 20px calc(-1*var(--gut));padding:2px var(--gut-r) 4px var(--gut);mask-image:linear-gradient(90deg,transparent 0,#000 var(--gut),#000 calc(100% - 40px),transparent)}
.filters::-webkit-scrollbar{display:none}
.filters .scroll-x{overflow:visible;flex:none}
.filters .sep{flex:none}
.filters .sep{width:1px;height:22px;background:var(--line-2)}
.select-chip{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:26px 18px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}}
.mcard{display:block;group:card}
.mcard .ph{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--surface-2);transition:transform .35s var(--ease),box-shadow .35s}
.mcard img{width:100%;height:100%;object-fit:cover}
.mcard:hover .ph{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12)}
.mcard .rt{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(10,10,12,.78);backdrop-filter:blur(8px);font:600 12px var(--f-ui)}
.mcard .rt svg{width:12px;height:12px;color:var(--accent)}
.mcard .rt small{color:var(--ink-3);font-weight:500}
.mcard h3{margin:12px 0 2px;font:600 16px/1.25 var(--f-ui)}
.mcard p{margin:0;color:var(--ink-3);font-size:13px}
.soon-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;scroll-snap-type:x mandatory}
.soon-row::-webkit-scrollbar{display:none}
.scard{scroll-snap-align:start;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.scard .bd{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative}
.scard .bd .tag{position:absolute;left:10px;top:10px;background:rgba(10,10,12,.75);backdrop-filter:blur(6px)}
.scard .bdy{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.scard h3{margin:0;font:600 16px var(--f-ui)}
.scard p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.int-btn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.int-btn svg{width:14px;height:14px}
.int-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;transition:border-color .2s,transform .2s}
.ccard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ccard h3{margin:0;font:600 16px var(--f-ui)}
.ccard p{margin:0;color:var(--ink-3);font-size:13px}
.amen{display:flex;gap:6px;flex-wrap:wrap}
.amen span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.05);border-radius:6px;padding:3px 7px}
.amen svg{width:13px;height:13px}

/* ---------- movie page */
.mhero{position:relative;overflow:hidden;isolation:isolate}
.mhero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.1);z-index:-2;transform:scale(1.04)}
.mhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,10,12,.96) 0%,rgba(10,10,12,.78) 45%,rgba(10,10,12,.35) 100%),linear-gradient(0deg,var(--bg),rgba(10,10,12,0) 50%)}
.mhero .wrap{display:grid;grid-template-columns:260px 1fr;gap:40px;padding-top:48px;padding-bottom:48px;align-items:end}
.mhero .poster{border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1);aspect-ratio:2/3}
.mhero h1{font:800 clamp(34px,5.5vw,62px)/.98 var(--f-display);letter-spacing:-.02em;margin:10px 0 14px}
.mhero .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--ink-2)}
.rbox{display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(10px);margin:18px 0}
.rbox b{font:700 22px var(--f-display);display:flex;align-items:center;gap:6px}
.rbox b svg{width:20px;height:20px;color:var(--accent)}
.rbox small{color:var(--ink-3);font-size:12.5px;display:block}
.fmt-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
@media (max-width:760px){.mhero .wrap{grid-template-columns:120px 1fr;gap:18px;padding-top:28px;align-items:start}.mhero h1{margin-top:0}.rbox{margin:12px 0}.mhero .cta-row{grid-column:1 / -1}}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}
@media (max-width:860px){.about{grid-template-columns:1fr}}
.about p{color:var(--ink-2);font-size:16px;line-height:1.65;margin:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px}
.person{text-align:center;font-size:13px}
.person .av{width:76px;height:76px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--f-display);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.person small{display:block;color:var(--ink-3)}
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.review{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.review header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}
.review p{margin:0;color:var(--ink-2);font-size:14px}

/* ---------- showtimes */
.st-head{position:sticky;top:64px;z-index:30;background:rgba(10,10,12,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.st-head .wrap{padding-top:16px;padding-bottom:14px;display:grid;gap:14px}
.st-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.st-title h1{font:700 24px/1.1 var(--f-display);margin:0}
.dates{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:64px;padding:8px 0;border-radius:14px;border:1px solid var(--line);display:grid;justify-items:center;gap:0;transition:all .18s}
.date small{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.date b{font:700 20px/1.2 var(--f-display)}
.date span{font-size:11.5px;color:var(--ink-3)}
.date:hover{border-color:var(--line-2)}
.date[aria-pressed="true"]{background:var(--ink);color:#141210;border-color:var(--ink)}
.date[aria-pressed="true"] small,.date[aria-pressed="true"] span{color:rgba(20,18,16,.6)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
@media (hover:none){.hover-only{display:none!important}}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cin-list{display:grid;gap:12px;margin-top:20px}
.crow{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;animation:viewIn .4s var(--ease) backwards}
@media (max-width:760px){.crow{grid-template-columns:1fr;gap:14px;padding:16px}}
.crow h3{margin:0 0 4px;font:600 16px var(--f-ui);display:flex;align-items:center;gap:8px}
.crow .sub{color:var(--ink-3);font-size:13px;margin:0 0 10px}
.fav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);margin-left:auto}
.fav svg{width:17px;height:17px}
.fav[aria-pressed="true"]{color:var(--rose)}
.times{display:flex;flex-wrap:wrap;gap:10px;align-content:start}
.time{position:relative;min-width:104px;padding:9px 14px;border-radius:12px;border:1px solid var(--line-2);display:grid;justify-items:center;gap:1px;transition:all .18s;background:transparent}
.time b{font:600 15px var(--f-mono);color:var(--green)}
.time small{font-size:11px;color:var(--ink-3);white-space:nowrap}
.time:hover:not(:disabled){border-color:currentColor;background:rgba(255,255,255,.04);transform:translateY(-1px)}
.time.fast b{color:var(--amber)} .time.almost b{color:var(--rose)}
.time:disabled{opacity:.38;cursor:not-allowed}
.time:disabled b{color:var(--ink-3);text-decoration:line-through}
.time .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);opacity:0;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;transition:all .15s;z-index:5;text-align:left;color:var(--ink-2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.time .tip b{display:block;font:600 12px var(--f-ui);color:var(--ink);margin-bottom:2px}
.time:hover .tip,.time:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
@media (hover:none){.time .tip{display:none}}

/* ---------- modal + sheet */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,5,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;box-shadow:0 40px 100px -20px rgba(0,0,0,.8);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0}
.modal-h h2{margin:0;font:700 21px var(--f-display)}
.modal-b{padding:18px 22px 22px}
.x-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.x-btn svg{width:16px;height:16px}
@media (max-width:560px){.scrim{place-items:end center;padding:0}.modal{width:100%;border-radius:24px 24px 0 0;max-height:88vh;animation:sheetUp .35s var(--ease)}}

<script type="text/plain" id="rh-theatre">
// Reelhouse 3D auditorium — renders a LAYOUTS[...] entry from data.js as a stadium-seated cinema.
// API: createTheatre(canvas, opts) → { refresh, viewFromSeat, overview, view360, nudge360, setSpin360, zoom360, viewScore, resize, setActive, dispose }.
// Throws if WebGL is unavailable so the app can fall back to its 2D map.
//
// World frame: screen plane at z ≈ 0 facing +z, seating extends toward +z, row A nearest the screen.
// 1 seat-width unit (data.js x/w) = SW metres.

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const SW = 0.6;                     // metres per seat-width unit
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a)*t;
const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

const CAT_COL = { classic:'#1d4f66', prime:'#952033', recliner:'#5c1820', motion:'#3a3e46' };
const WHEEL_COL = '#2f6fd6';
const SOLD_COL = '#2a2a2f';
const GOLD = '#ffcb5c';

let rectLibReady = false;

export function createTheatre(canvas, opts){
  const { layout, screenImage, palette = ['#0a0a0c', '#333', '#ccc', GOLD], format = '2D',
          stateOf = () => 'available', onHover = () => {}, onSeatClick = () => {}, onViewChange = () => {} } = opts;

  /* ------------------------------------------------------------ renderer */
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' }); }
  catch (e) { throw new Error('WebGL unavailable: ' + (e && e.message)); }
  if (!renderer.getContext()) throw new Error('WebGL unavailable');
  if (!rectLibReady){ RectAreaLightUniformsLib.init(); rectLibReady = true; }
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  const PR = Math.min(window.devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(PR);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#050406');
  const camera = new THREE.PerspectiveCamera(46, 1, 0.05, 200);

  // everything we allocate is tracked so dispose() can free it
  const owned = new Set();
  const own = x => (owned.add(x), x);
  const G = g => own(g), M = m => own(m), TX = t => own(t);
  const add = (geo, mat, parent = scene) => { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; };

  /* ------------------------------------------------------------ textures */
  function canvasTex(w, h, draw, { repeat = false, srgb = true } = {}){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = TX(new THREE.CanvasTexture(c)); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const seeded = seed => () => { seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; };
  const carpetTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#17121a'; g.fillRect(0, 0, w, h);
    const r = seeded(7);
    for (let i = 0; i < 6000; i++){ const v = r(); g.fillStyle = v > .5 ? `rgba(255,220,200,${.015 + r()*.03})` : `rgba(0,0,0,${.06 + r()*.08})`; g.fillRect(r()*w, r()*h, 1 + r()*1.5, 1 + r()*1.5); }
    g.strokeStyle = 'rgba(160,60,80,.16)'; g.lineWidth = 2;
    for (let y = 0; y < h; y += 64) for (let x = 0; x < w; x += 64){ g.beginPath(); g.moveTo(x + 32, y + 12); g.lineTo(x + 52, y + 32); g.lineTo(x + 32, y + 52); g.lineTo(x + 12, y + 32); g.closePath(); g.stroke(); }
    g.fillStyle = 'rgba(255,190,90,.10)'; for (let y = 0; y < h; y += 64) for (let x = 0; x < w; x += 64){ g.beginPath(); g.arc(x, y, 3, 0, Math.PI*2); g.fill(); }
  }, { repeat:true });
  const fabricTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#1b171c'; g.fillRect(0, 0, w, h); const r = seeded(11);
    for (let i = 0; i < 2500; i++){ g.fillStyle = `rgba(${r() > .5 ? '255,255,255' : '0,0,0'},${.02 + r()*.04})`; g.fillRect(r()*w, r()*h, 1, 1 + r()*3); }
  }, { repeat:true });
  const glowTex = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const exitTex = canvasTex(256, 96, (g, w, h) => {
    g.fillStyle = '#0e7a3a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#eafff1'; g.font = 'bold 58px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('EXIT', w/2 + 22, h/2 + 3);
    // running-man arrow hint
    g.beginPath(); g.moveTo(30, h/2); g.lineTo(56, h/2 - 18); g.lineTo(56, h/2 + 18); g.closePath(); g.fill();
  });
  const wheelTex = canvasTex(128, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.arc(58, 22, 10, 0, Math.PI*2); g.fill();                 // head
    g.beginPath(); g.moveTo(58, 38); g.lineTo(58, 70); g.lineTo(86, 70); g.lineTo(98, 100); g.stroke();   // body + leg
    g.beginPath(); g.moveTo(58, 50); g.lineTo(82, 50); g.stroke();             // arm
    g.beginPath(); g.arc(56, 84, 28, Math.PI*0.15, Math.PI*1.55); g.stroke();  // wheel
  });

  /* ------------------------------------------------------------ geometry of the room */
  const isImax = /IMAX/i.test(format);
  const curve = layout.curve, rise = layout.rise;
  const kindOfRow = row => row.seats.some(s => s.kind === 'recliner') ? 'recliner' : row.seats.some(s => s.kind === 'motion') ? 'motion' : 'std';
  const BACK_OFF = { std:0.42, recliner:0.56, motion:0.46 };
  const rows3 = []; let zf = layout.screenDist;
  layout.rows.forEach((row, r) => {
    const kind = kindOfRow(row);
    const d = kind === 'recliner' ? Math.max(1.7, layout.pitch) : Math.max(0.95, layout.pitch);
    rows3.push({ row, r, kind, zf, d, y: r*rise });
    zf += d;
  });
  const lastRow = rows3[rows3.length - 1];
  const yTop = lastRow.y;
  const zBackSeats = lastRow.zf + lastRow.d;
  const zBack = zBackSeats + 1.9;                                           // cross-aisle behind the last row
  let maxExtent = 0;
  for (const s of layout.seats) maxExtent = Math.max(maxExtent, (Math.abs(s.x) + s.w/2)*SW);
  const halfRoom = maxExtent + 1.75;
  const curveZ = x => curve*x*x;                                            // rows bow toward the screen at the ends

  // screen
  const scrW = layout.screenW;
  const scrAspect = isImax ? 1.55 : 2.05;
  const scrH = scrW/scrAspect;
  const scrBottom = isImax ? 0.75 : 1.35;
  const scrTop = scrBottom + scrH;
  const scrCY = scrBottom + scrH/2;
  const yCeil = Math.max(yTop + 3.8, scrTop + 1.5);

  // floor height under a z position (centre line)
  const floorAt = z => { if (z < rows3[0].zf) return 0; for (const r of rows3) if (z < r.zf + r.d) return r.y; return yTop; };

  /* ------------------------------------------------------------ materials */
  const mat = {
    carpet: M(new THREE.MeshStandardMaterial({ map:carpetTex, roughness:1 })),
    riser: M(new THREE.MeshStandardMaterial({ color:'#120e12', roughness:.95 })),
    fabric: M(new THREE.MeshStandardMaterial({ map:fabricTex, color:'#ffffff', roughness:1 })),
    slat: M(new THREE.MeshStandardMaterial({ color:'#2f2219', roughness:.6, metalness:.05 })),
    dark: M(new THREE.MeshStandardMaterial({ color:'#0b0a0d', roughness:.95 })),
    ceiling: M(new THREE.MeshStandardMaterial({ color:'#0c0b0f', roughness:1 })),
    mask: M(new THREE.MeshStandardMaterial({ color:'#040405', roughness:1 })),
    curtain: M(new THREE.MeshStandardMaterial({ color:'#3b0c14', roughness:.88, side:THREE.DoubleSide })),
    stage: M(new THREE.MeshStandardMaterial({ color:'#1a1310', roughness:.7 })),
    velvet: M(new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.86 })),
    leather: M(new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.46 })),
    plastic: M(new THREE.MeshStandardMaterial({ color:'#16151a', roughness:.55, metalness:.15 })),
    metal: M(new THREE.MeshStandardMaterial({ color:'#5b5f67', roughness:.32, metalness:.85 })),
    accent: M(new THREE.MeshBasicMaterial({ color: hdr('#ff7a1a', 0.75) })),
    person: M(new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.92 })),
    shell: M(new THREE.MeshStandardMaterial({ color:'#ffd88a', emissive:GOLD, emissiveIntensity:.55, roughness:.5 })),
    decal: M(new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.8, polygonOffset:true, polygonOffsetFactor:-2 })),
    symbol: M(new THREE.MeshBasicMaterial({ map:wheelTex, transparent:true, depthWrite:false, color:'#e9eef8', polygonOffset:true, polygonOffsetFactor:-4 })),
    stepLed: M(new THREE.MeshBasicMaterial({ color: hdr('#ffb35c', 1.9) })),
    sconce: M(new THREE.MeshBasicMaterial({ color: hdr('#ffc98a', 1.5) })),
    downlight: M(new THREE.MeshBasicMaterial({ color: hdr('#ffe9cc', 1.15) })),
    exit: M(new THREE.MeshBasicMaterial({ map:exitTex, color: hdr('#ffffff', 1.25) })),
    booth: M(new THREE.MeshBasicMaterial({ color: hdr('#fff1d6', 1.35) })),
    glow: M(new THREE.MeshBasicMaterial({ map:glowTex, color:'#ffb26b', transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false })),
    pool: M(new THREE.MeshBasicMaterial({ map:glowTex, color:GOLD, transparent:true, opacity:.55, blending:THREE.AdditiveBlending, depthWrite:false })),
  };

  /* ------------------------------------------------------------ floor: stepped, curved platforms */
  carpetTex.repeat.set(1, 1);
  (function buildFloor(){
    const pos = [], uv = [], nor = [], idx = [];
    const quad = (a, b, c, d, n, uva, uvb, uvc, uvd) => {
      const i = pos.length/3; pos.push(...a, ...b, ...c, ...d); nor.push(...n, ...n, ...n, ...n); uv.push(...uva, ...uvb, ...uvc, ...uvd);
      idx.push(i, i + 1, i + 2, i, i + 2, i + 3);
    };
    const N = 48, x0 = -halfRoom, x1 = halfRoom, U = 1.4;
    const strip = (zA, zB, y) => {          // horizontal curved strip from zA(x) to zB(x)
      for (let k = 0; k < N; k++){
        const xa = lerp(x0, x1, k/N), xb = lerp(x0, x1, (k + 1)/N);
        const a = [xa, y, zA - curveZ(xa)], b = [xb, y, zA - curveZ(xb)], c = [xb, y, zB - curveZ(xb)], d = [xa, y, zB - curveZ(xa)];
        quad(a, d, c, b, [0, 1, 0], [a[0]/U, -a[2]/U], [d[0]/U, -d[2]/U], [c[0]/U, -c[2]/U], [b[0]/U, -b[2]/U]);
      }
    };
    const riser = (z, y0, y1) => {
      for (let k = 0; k < N; k++){
        const xa = lerp(x0, x1, k/N), xb = lerp(x0, x1, (k + 1)/N), za = z - curveZ(xa), zb = z - curveZ(xb);
        quad([xa, y0, za], [xb, y0, zb], [xb, y1, zb], [xa, y1, za], [0, 0, 1], [xa/U, y0/U], [xb/U, y0/U], [xb/U, y1/U], [xa/U, y1/U]);
      }
    };
    strip(-1.0, rows3[0].zf, 0);
    rows3.forEach((r, i) => { strip(r.zf, r.zf + r.d, r.y); if (i > 0) riser(r.zf, rows3[i - 1].y, r.y); });
    strip(zBackSeats, zBack + curveZ(halfRoom) + 0.5, yTop);
    const geo = G(new THREE.BufferGeometry());
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    add(geo, mat.carpet);
    // dark fill under the stepped floor so the sides never show gaps
    const under = add(G(new THREE.BoxGeometry(halfRoom*2, 0.02, zBack + 2)), mat.riser); under.position.set(0, -0.012, (zBack - 1)/2);
  })();

  /* ------------------------------------------------------------ walls, ceiling, stage, screen */
  const roomLen = zBack + 1.2;
  const wallGeo = G(new THREE.PlaneGeometry(roomLen, yCeil + 0.2));
  for (const s of [-1, 1]){
    const w = add(wallGeo, mat.fabric); w.rotation.y = -s*Math.PI/2; w.position.set(s*halfRoom, (yCeil + 0.2)/2 - 0.1, roomLen/2 - 1.2);
  }
  fabricTex.repeat.set(roomLen/2, (yCeil + 0.2)/2);
  const ceil = add(G(new THREE.PlaneGeometry(halfRoom*2, roomLen)), mat.ceiling); ceil.rotation.x = Math.PI/2; ceil.position.set(0, yCeil, roomLen/2 - 1.2);
  const back = add(G(new THREE.PlaneGeometry(halfRoom*2, yCeil + 0.2)), mat.fabric); back.rotation.y = Math.PI; back.position.set(0, (yCeil + 0.2)/2 - 0.1, zBack + curveZ(halfRoom)*0 + 0.0);
  const front = add(G(new THREE.PlaneGeometry(halfRoom*2, yCeil + 0.2)), mat.mask); front.position.set(0, (yCeil + 0.2)/2 - 0.1, -0.6);

  // acoustic slats along the side walls, following the stepped floor
  (function slats(){
    const zs = []; for (let z = 0.6; z < zBack - 0.4; z += 0.5) zs.push(z);
    const im = new THREE.InstancedMesh(G(new THREE.BoxGeometry(0.05, 1, 0.09)), mat.slat, zs.length*2);
    const m = new THREE.Matrix4(); let k = 0;
    for (const s of [-1, 1]) for (const z of zs){
      const y0 = floorAt(z) + 0.9, y1 = yCeil - 0.35, h = Math.max(0.5, y1 - y0);
      m.compose(new V3(s*(halfRoom - 0.05), (y0 + y1)/2, z), new THREE.Quaternion(), new V3(1, h, 1)); im.setMatrixAt(k++, m);
    }
    im.computeBoundingSphere(); scene.add(im);
    // wainscot rail at slat base
    for (const s of [-1, 1]){
      const rail = add(G(new THREE.BoxGeometry(0.06, 0.06, zBack)), mat.slat); rail.position.set(s*(halfRoom - 0.05), 0, zBack/2);
      rail.visible = false; // stepped floor makes a single rail look wrong; slats carry the look
    }
  })();

  // stage + screen + masking + curtains
  const stageH = isImax ? 0.3 : 0.5;
  const stage = add(G(new THREE.BoxGeometry(halfRoom*2, stageH, 1.6)), mat.stage); stage.position.set(0, stageH/2, 0.15);
  const stageLip = add(G(new THREE.BoxGeometry(halfRoom*2, 0.03, 0.03)), mat.stepLed); stageLip.position.set(0, stageH - 0.02, 0.96);

  const screenTex = TX(new THREE.CanvasTexture(screenImage)); screenTex.colorSpace = THREE.SRGBColorSpace;
  screenTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const imgAspect = (screenImage.width || 16)/(screenImage.height || 9);
  const crop = scrAspect > imgAspect ? { x:1, y:imgAspect/scrAspect } : { x:scrAspect/imgAspect, y:1 };

          onViewChange(md, s){ mode = md; lastViewed = s || null; $('#resetBtn', main).hidden = md === 'overview'; $('#btn360', main).setAttribute('aria-pressed', String(md === '360')); badge(s); update(); },

        });

        console.warn('3D theatre unavailable, using the seat map', err);
        $('#ld', main).remove(); $('#th', main).remove(); $('#v3d', main).disabled = true;
        setView3d(false);
      }
    })();

    $('#goBtn', main).onclick = () => {
      const gap = gapProblem();
      if (gap){ toast(`Please don't leave seat ${gap.id} empty on its own — pick it or move your selection`, I.info, 3800); if (!view3d) mapEl.querySelector(`[data-seat="${gap.id}"]`)?.focus(); return; }

      location.hash = '#/checkout';
    };
    const onKey = e => {
      if (anyModalOpen() || e.target.matches('input, textarea')) return;
      if (e.key === 'Escape' && mode !== 'overview' && theatre){ e.preventDefault(); theatre.overview(); }
      if (mode === '360' && theatre && e.key.startsWith('Arrow')){
        e.preventDefault(); spinning = false;

      }
      if (mode === '360' && theatre && (e.key === '+' || e.key === '=' || e.key === '-')){ e.preventDefault(); theatre.zoom360(e.key === '-' ? 6 : -6); }
      if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey) setView3d(!view3d && !!theatre);
    };

      removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis);
      document.body.classList.remove('on-seats'); delete document.body.dataset.hover;
    };
  }
  return { renderSeats };
})();

        </div>
        <div class="sum-total"><span>Amount payable</span><b>${inr(a.total)}</b></div>`;
      $('#dBtn', main).onclick = () => { detailsOpen = !detailsOpen; refresh(); $('#dBtn', main).focus(); };
      $('#payBtn', main).innerHTML = `${I.check}Pay ${inr(a.total)}`;
      return a;
    }

    /* -------- payment forms */
    const WALLETS = ['Paytm','PhonePe','Amazon Pay','MobiKwik'];
    const drawPay = () => {
      $$('.pay-tab', main).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pay === P.pay)));
      const f = $('#payForm', main);
      if (P.pay === 'upi') f.innerHTML = `<div class="upi-apps">${['GPay','PhonePe','Paytm','BHIM'].map(a => `<button class="chip" data-upi="${a}" aria-pressed="${P.upiApp === a}">${a}</button>`).join('')}</div>
        <div class="field"><label for="upi">UPI ID</label><input class="input" id="upi" placeholder="name@bank" autocomplete="off" value="${esc(P.upi || '')}"><p class="err" hidden></p></div>`;
      else if (P.pay === 'card') f.innerHTML = `<div class="form-grid"><div class="field" style="grid-column:1/-1"><label for="cc">Card number</label><input class="input mono" id="cc" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19"><p class="err" hidden></p></div>
        <div class="field"><label for="ex">Expiry</label><input class="input mono" id="ex" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5"><p class="err" hidden></p></div>
        <div class="field"><label for="cv">CVV</label><input class="input mono" id="cv" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4" type="password"><p class="err" hidden></p></div></div>`;
      else f.innerHTML = `<div class="chips" role="group" aria-label="Wallet">${WALLETS.map(w => `<button class="chip" data-wallet="${w}" aria-pressed="${P.wallet === w}">${w}</button>`).join('')}</div><p class="err" id="wErr" hidden style="margin-top:8px">Choose a wallet</p>`;
      $('#cc', f)?.addEventListener('input', e => { const d = e.target.value.replace(/\D/g, '').slice(0, 16); e.target.value = d.replace(/(.{4})/g, '$1 ').trim(); });
      $('#ex', f)?.addEventListener('input', e => { let d = e.target.value.replace(/\D/g, '').slice(0, 4); if (d.length > 2) d = d.slice(0, 2) + '/' + d.slice(2); e.target.value = d; });
      $('#upi', f)?.addEventListener('input', e => P.upi = e.target.value);
    };
    main.addEventListener('click', e => {
      const t = e.target.closest('[data-pay]'); if (t){ P.pay = t.dataset.pay; drawPay(); return; }
      const u = e.target.closest('[data-upi]'); if (u){ P.upiApp = u.dataset.upi; drawPay(); if (!$('#upi', main).value){ $('#upi', main).value = P.upi = `${(contact.name || 'you').toLowerCase().replace(/[^a-z]/g, '') || 'you'}@ok${u.dataset.upi.toLowerCase()}`; } return; }
      const w = e.target.closest('[data-wallet]'); if (w){ P.wallet = w.dataset.wallet; drawPay(); }
    });

    /* -------- validation + pay */
    const fieldErr = (inp, msg) => { const er = inp.parentElement.querySelector('.err'); inp.setAttribute('aria-invalid', String(!!msg)); if (er){ er.hidden = !msg; er.textContent = msg || ''; } return !msg; };
    ['cn','cp','ce'].forEach(id => $('#' + id, main).addEventListener('input', e => fieldErr(e.target, '')));
    function validate(){
      const n = $('#cn', main), p = $('#cp', main), em = $('#ce', main); let ok = true, first = null;
      const chk = (inp, msg) => { if (!fieldErr(inp, msg)){ ok = false; first ||= inp; } };
      chk(n, n.value.trim().length < 2 ? 'Enter your name' : '');
      chk(p, /^[6-9]\d{9}$/.test(p.value) ? '' : 'Enter a valid 10-digit mobile number');
      chk(em, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()) ? '' : 'Enter a valid email');
      if (P.pay === 'upi'){ const u = $('#upi', main); chk(u, /^[\w.\-]{2,}@[a-z]{2,}$/i.test(u.value.trim()) ? '' : 'Enter a valid UPI ID, like name@bank'); }
      if (P.pay === 'card'){
        const cc = $('#cc', main), ex = $('#ex', main), cv = $('#cv', main);
        chk(cc, cc.value.replace(/\s/g, '').length === 16 ? '' : 'Enter the 16-digit card number');
        const [mm, yy] = ex.value.split('/').map(Number), now = new Date(), expOk = mm >= 1 && mm <= 12 && yy >= 0 && new Date(2000 + yy, mm, 0) >= new Date(now.getFullYear(), now.getMonth(), 1);
        chk(ex, expOk ? '' : 'Enter a valid future expiry');
        chk(cv, /^\d{3,4}$/.test(cv.value) ? '' : 'Enter the CVV');
      }
      if (P.pay === 'wallet' && !P.wallet){ ok = false; $('#wErr', main).hidden = false; first ||= $('[data-wallet]', main); }
      if (!ok){ first.focus(); first.scrollIntoView({block:'center', behavior: REDUCED ? 'auto' : 'smooth'}); }
      return ok;
    }
    $('#payBtn', main).onclick = async () => {
      if (!validate()) return;
      const a = refresh();
      saveContact({ name: $('#cn', main).value.trim(), phone: $('#cp', main).value, email: $('#ce', main).value.trim() });
      const ov = document.createElement('div'); ov.className = 'processing'; ov.setAttribute('role', 'alertdialog'); ov.setAttribute('aria-label', 'Processing payment');
      ov.innerHTML = `<div class="box"><div class="spin"></div><b>Processing ${inr(a.total)}</b><small>${P.pay === 'upi' ? 'Approve the request in your UPI app…' : P.pay === 'card' ? 'Securely contacting your bank…' : `Paying with ${P.wallet}…`}</small></div>`;
      document.body.append(ov); clearInterval(tick);
      await new Promise(r => setTimeout(r, REDUCED ? 400 : 1700));
      ov.innerHTML = `<div class="box"><div class="ok-ring">${I.check}</div><b>Payment successful</b><small>Booking your seats…</small></div>`;
      await new Promise(r => setTimeout(r, REDUCED ? 200 : 900));
      const id = 'RH' + Math.random().toString(36).slice(2, 6).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase();
      S.bookings.unshift({ id, showId: show.id, movieId: m.id, cinemaId: c.id, date: show.date, time: show.time, seats: P.seats.slice(), food: {...P.food},
        amounts: { tickets:a.tickets, fee:a.fee, gst:a.gst, food:a.food, discount:a.discount, total:a.total }, offer: a.offer?.code || null,
        pay: P.pay === 'wallet' ? P.wallet : P.pay.toUpperCase(), contact: {...S.contact}, pickup: String(1000 + Math.floor(Math.random()*9000)),
        createdAt: Date.now(), status:'confirmed' });
      saveBookings(); S.pending = null; ov.remove();
      location.hash = `#/ticket/${id}?new=1`;
    };

    /* -------- hold timer */
    const tEl = $('#timer', main);
    const tick = setInterval(() => {
      const left = Math.max(0, Math.round((P.holdUntil - Date.now())/1000));
      $('span', tEl).textContent = `${String(Math.floor(left/60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
      tEl.classList.toggle('low', left < 60); tEl.setAttribute('aria-label', `Seats held for ${Math.floor(left/60)} minutes ${left % 60} seconds`);
      if (left === 60) toast('1 minute left to complete your booking', I.clock);
      if (left <= 0){ clearInterval(tick); const md = openModal({ title:'Time\'s up', body:`<p style="margin:0 0 18px;color:var(--ink-2)">We released seats ${seats.map(s => s.id).join(', ')} so others can book them. You can pick seats again.</p><button class="btn btn-primary" data-close style="width:100%">Choose seats again</button>`, onClose: () => { S.pending = null; location.hash = `#/seats/${encodeURIComponent(show.id)}`; } }); }
    }, 250);
    $('#coBack', main).onclick = () => { delete P.holdUntil; S.pending = P; location.hash = `#/seats/${encodeURIComponent(show.id)}`; };

    drawFood(); drawPay(); refresh();
    return () => clearInterval(tick);
  }

  /* ================================================================== TICKET */
  function qrSVG(text){
    try { const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
    catch { return `<svg viewBox="0 0 10 10"><text x="5" y="5.5" font-size="1.4" text-anchor="middle" fill="#17140f">QR unavailable</text></svg>`; }
  }
  function showStart(b){ const [h, mi] = b.time.split(':').map(Number), d = new Date(b.date + 'T00:00'); d.setHours(h, mi); return d; }
  function renderTicket(main, id){
    setNav('bookings');
    const b = S.bookings.find(x => x.id === id); if (!b) return notFound(main, 'We couldn\'t find that booking.');
    const show = showById(b.showId), m = movieById(b.movieId), c = cinemaById(b.cinemaId);
    const L = show ? LAYOUTS[show.layoutId] : null;
    const seats = b.seats.map(sid => L?.seats.find(s => s.id === sid)).filter(Boolean);
    const isNew = qs().get('new') === '1', cancelled = b.status === 'cancelled';
    const canCancel = !cancelled && c.cancellable && showStart(b) - Date.now() > 2*3600e3;
    const foodLines = Object.entries(b.food || {}).map(([fid, q]) => `${FOOD.find(f => f.id === fid)?.name} × ${q}`);
    main.innerHTML = `<div class="view"><div class="wrap"><div class="tk-wrap">
      <div class="tk-h">${isNew ? `<h1>You're all set!</h1><p>Booking confirmed — tickets sent to ${esc(b.contact.email)}</p>` : `<h1>Your ticket</h1><p>Show this at the entrance</p>`}</div>
      <article class="ticket" aria-label="E-ticket">
        <span class="tk-status ${cancelled ? 'cancelled' : ''}">${cancelled ? 'Cancelled' : 'Confirmed'}</span>
        <div class="tk-art" style="background-image:url(${backdropURL(m, 800)})"><div><h2>${esc(m.title)}</h2><p>${m.cert} · ${show?.lang || ''} · ${show?.format || ''} · ${fmtDur(m.mins)}</p></div></div>
        <div class="tk-body"><div class="tk-grid">
          <div class="big"><small>Date</small><b>${fmtDay(b.date, {day:'numeric', month:'short'})}</b></div>
          <div class="big"><small>Time</small><b>${fmtTime(b.time)}</b></div>
          <div class="full"><small>Cinema</small><b>${esc(c.name)}</b></div>
          <div><small>Screen</small><b>${show ? show.screenLabel : '—'}</b></div>
          <div><small>${seats.length > 1 ? 'Seats' : 'Seat'} · ${seats.length}</small><b>${b.seats.join(', ')}</b></div>
          <div><small>Class</small><b>${[...new Set(seats.map(s => catName(s.cat)))].join(', ')}</b></div>
          <div><small>Paid</small><b>${inr(b.amounts.total)} · ${esc(b.pay)}</b></div>
          ${foodLines.length ? `<div class="full"><small>Food pickup · code ${b.pickup}</small><b>${foodLines.map(esc).join(' · ')}</b></div>` : ''}
        </div></div>
        <div class="tk-perf"></div>
        <div class="tk-qr"><div class="qr" aria-label="QR code for booking ${b.id}">${qrSVG(`REELHOUSE|${b.id}|${b.showId}|${b.seats.join(',')}`)}</div>
          <div><small>Booking ID</small><div class="bid">${b.id}</div><p>${cancelled ? 'This booking was cancelled and refunded.' : 'Arrive 15 minutes early. Doors close 10 minutes after the show starts.'}</p></div></div>
      </article>
      <div class="tk-actions">
        ${!cancelled ? `<button class="btn btn-ghost" id="calBtn">${I.cal}Add to calendar</button><button class="btn btn-ghost" id="shareBtn">${I.ticket}Share</button>` : ''}
        ${canCancel ? `<button class="btn btn-ghost" id="cancelBtn" style="color:var(--rose)">${I.x}Cancel booking</button>` : ''}
        <a class="btn btn-primary" href="#/">Book another</a>
      </div>
    </div></div></div>`;
    $('#calBtn', main)?.addEventListener('click', () => {
      const st = showStart(b), en = new Date(st.getTime() + (m.mins + 20)*60e3);
      const f = d => `${iso(d).replace(/-/g, '')}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
      const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Reelhouse//Tickets//EN','BEGIN:VEVENT',`UID:${b.id}@reelhouse`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(st)}`,`DTEND:${f(en)}`,
        `SUMMARY:${m.title} (${show?.format || ''})`,`LOCATION:${c.name}\\, ${c.address.replace(/,/g, '\\,')}`,`DESCRIPTION:Booking ${b.id} · Seats ${b.seats.join(' ')} · ${show?.screenLabel || ''}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'})); a.download = `${m.title.replace(/\W+/g, '-')}-${b.id}.ics`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Calendar file downloaded', I.cal);
    });
    $('#shareBtn', main)?.addEventListener('click', async () => {
      const text = `${m.title} · ${fmtDay(b.date)} ${fmtTime(b.time)} · ${c.name} · Seats ${b.seats.join(', ')} · Booking ${b.id}`;
      try { if (navigator.share){ await navigator.share({ title:`${m.title} tickets`, text }); return; } await navigator.clipboard.writeText(text); toast('Ticket details copied', I.check); }
      catch { /* share sheet dismissed */ }
    });
    $('#cancelBtn', main)?.addEventListener('click', () => {
      const refund = b.amounts.tickets + b.amounts.food - b.amounts.discount;
      const md = openModal({ title:'Cancel this booking?', body:`<p style="margin:0 0 6px;color:var(--ink-2)">${b.seats.length} seat${b.seats.length > 1 ? 's' : ''} for ${esc(m.title)} on ${fmtDay(b.date)} at ${fmtTime(b.time)}.</p>
        <p style="margin:0 0 18px;color:var(--ink-2)">You'll get <b style="color:var(--ink)">${inr(Math.max(0, refund))}</b> back in 5–7 days. Convenience fees aren't refundable.</p>
        <div style="display:flex;gap:10px"><button class="btn btn-ghost" data-close style="flex:1">Keep it</button><button class="btn btn-primary" id="doCancel" style="flex:1;background:var(--rose);color:#2a0610">Cancel booking</button></div>` });
      $('#doCancel', md.el).onclick = () => { b.status = 'cancelled'; b.refund = Math.max(0, refund); saveBookings(); md.close(); toast('Booking cancelled · refund initiated', I.check); renderTicket(main, id); };
    });
    if (isNew && !REDUCED) confetti();
    if (isNew) history.replaceState(null, '', `#/ticket/${id}`);
  }
  function confetti(){
    const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    const cols = ['#ffcb5c','#ff5d73','#46d48a','#8fd7ff','#f4f1ea','#c9a2ff'];
    for (let i = 0; i < 90; i++){ const p = document.createElement('i');
      p.style.cssText = `left:${Math.random()*100}%;background:${cols[i % cols.length]};--dx:${(Math.random() - .5)*240}px;--r:${Math.random()*900 - 450}deg;animation-duration:${1.8 + Math.random()*1.6}s;animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*180}deg)`;
      box.append(p); }
    document.body.append(box); setTimeout(() => box.remove(), 4200);
  }

  /* ================================================================== MY TICKETS */
  function renderBookings(main){
    setNav('bookings');
    let tab = qs().get('tab') || 'upcoming';
    const now = Date.now();
    const upcoming = S.bookings.filter(b => b.status === 'confirmed' && showStart(b).getTime() + 3*3600e3 > now);
    const past = S.bookings.filter(b => !upcoming.includes(b));
    const draw = () => {
      const list = tab === 'upcoming' ? upcoming : past;
      main.innerHTML = `<div class="view"><div class="wrap">
        <div class="page-h"><h1>My tickets</h1><p>${S.bookings.length ? `${upcoming.length} upcoming · ${past.length} past or cancelled` : 'Your bookings will show up here'}</p></div>
        <div class="chips" style="margin:20px 0" role="tablist"><button class="chip" role="tab" data-tab="upcoming" aria-selected="${tab === 'upcoming'}" aria-pressed="${tab === 'upcoming'}">Upcoming (${upcoming.length})</button><button class="chip" role="tab" data-tab="past" aria-selected="${tab === 'past'}" aria-pressed="${tab === 'past'}">Past & cancelled (${past.length})</button></div>
        <div class="bk-list">${list.length ? list.map(b => { const m = movieById(b.movieId), c = cinemaById(b.cinemaId), st = b.status === 'cancelled' ? 'cancelled' : tab === 'past' ? 'past' : '';
          return `<a class="bk" href="#/ticket/${b.id}"><img src="${posterURL(m, 160)}" alt=""><div><h3>${esc(m.title)}</h3><p>${fmtDay(b.date)} · ${fmtTime(b.time)} · ${esc(c.name)}</p><p>Seats ${b.seats.join(', ')} · ${inr(b.amounts.total)}</p></div>
            <span class="st ${st}">${st === 'cancelled' ? 'Cancelled' : st === 'past' ? 'Watched' : 'Confirmed'}</span></a>`; }).join('')
          : `<div class="empty card"><b>${tab === 'upcoming' ? 'No upcoming shows' : 'Nothing here yet'}</b>${tab === 'upcoming' ? 'Find something to watch tonight.' : 'Past and cancelled bookings appear here.'}<br><br><a class="btn btn-primary" href="#/">Browse movies</a></div>`}</div>
      </div></div>`;
      $$('[data-tab]', main).forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); $(`[data-tab="${tab}"]`, main).focus(); });
    };
    draw();
  }
  return { renderCheckout, renderTicket, renderBookings };
})();

/* ===== js/app.js ===== */
__rh.app = (() => {
  const { cityById } = __rh.data;
  const { S, $, setCity, openCityPicker, openSearch, anyModalOpen, updateTicketBadge } = __rh.core;
  const { renderHome, renderMovie, renderShowtimes, renderCinemas, renderCinema, notFound } = __rh.browse;
  const { renderSeats } = __rh.seats;
  const { renderCheckout, renderTicket, renderBookings } = __rh.checkout;
  // Boot + hash router. Each view renders into <main> and may return a cleanup function.

  const main = $('#main');
  const ROUTES = [
    [/^\/?$/, () => renderHome(main)],
    [/^\/movie\/([^/]+)$/, id => renderMovie(main, id)],
    [/^\/movie\/([^/]+)\/tickets$/, id => renderShowtimes(main, id)],
    [/^\/cinemas$/, () => renderCinemas(main)],
    [/^\/cinema\/([^/]+)$/, id => renderCinema(main, id)],
    [/^\/seats\/(.+)$/, id => renderSeats(main, decodeURIComponent(id))],
    [/^\/checkout$/, () => renderCheckout(main)],
    [/^\/ticket\/([^/]+)$/, id => renderTicket(main, id)],
    [/^\/bookings$/, () => renderBookings(main)],
  ];
  let cleanup = null, lastPath = null;
  function route(){
    const raw = location.hash.replace(/^#/, '') || '/', path = raw.split('?')[0];
    try { cleanup?.(); } catch (e){ console.error(e); } cleanup = null;
    const hit = ROUTES.find(([re]) => re.test(path));
    try { cleanup = hit ? hit[1](...path.match(hit[0]).slice(1)) || null : (notFound(main), null); }
    catch (e){ console.error(e); notFound(main, 'Something went wrong loading this page.'); }
    if (path !== lastPath){ window.scrollTo({top:0, behavior:'instant'}); main.focus({preventScroll:true}); }
    lastPath = path;
  }

  (async function boot(){
    document.body.classList.add('has-tabbar');
    // posters draw with the web fonts, so wait for them (bounded)
    try { await Promise.race([Promise.all(['800 40px "Bricolage Grotesque"','500 14px "Geist"','600 12px "Geist"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch {}
    $('#cityName').textContent = cityById(S.city || 'mumbai').name;
    $('#cityBtn').onclick = () => openCityPicker(false);
    $('#searchBtn').onclick = openSearch;
    addEventListener('keydown', e => {
      if (e.key === '/' && !anyModalOpen() && !e.target.matches('input, textarea, select') && !document.body.classList.contains('on-seats')){ e.preventDefault(); openSearch(); }
    });
    addEventListener('hashchange', route);
    updateTicketBadge();
    const first = !S.city;
    if (first) S.city = 'mumbai';           // show Mumbai behind the welcome picker
    route();
    if (first) openCityPicker(true);
  })();
  return {  };
})();
</script>
